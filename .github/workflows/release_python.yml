name: release_python

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  test:
    uses: ./.github/workflows/test_python.yml

  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        python-version: ['3.13']
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            maturin_args: --release --out dist --find-interpreter
          - runner: ubuntu-22.04
            target: x86
            maturin_args: --release --out dist --find-interpreter --no-default-features --features=python
          - runner: ubuntu-22.04
            target: aarch64
            maturin_args: --release --out dist --find-interpreter
          - runner: ubuntu-22.04
            target: armv7
            maturin_args: --release --out dist --find-interpreter --no-default-features --features=python
          - runner: ubuntu-22.04
            target: s390x
            maturin_args: --release --out dist --find-interpreter --no-default-features --features=python
          - runner: ubuntu-22.04
            target: ppc64le
            maturin_args: --release --out dist --find-interpreter --no-default-features --features=python
    steps:
      - uses: actions/checkout@v4
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: ${{ matrix.platform.maturin_args }}
          sccache: 'true'
          manylinux: auto
          before-script-linux: |
            git config --global --add safe.directory /github/workspace
            git config --global --add safe.directory /home/runner/work/cfsem-py/cfsem-py
            yum install -y clang lld libstdc++-devel openblas-devel
      - name: Install auditwheel
        run: python -m pip install auditwheel
      - name: Repair wheels
        run: bindings/repair_wheel.sh dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        python-version: ['3.13']
        platform:
          - runner: ubuntu-22.04
            target: x86_64
            maturin_args: --release --out dist --find-interpreter --no-default-features --features=python
          - runner: ubuntu-22.04
            target: x86
            maturin_args: --release --out dist --find-interpreter --no-default-features --features=python
          - runner: ubuntu-22.04
            target: aarch64
            maturin_args: --release --out dist --find-interpreter --no-default-features --features=python
          - runner: ubuntu-22.04
            target: armv7
            maturin_args: --release --out dist --find-interpreter --no-default-features --features=python
    steps:
      - uses: actions/checkout@v4
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: ${{ matrix.platform.maturin_args }}
          sccache: 'true'
          manylinux: musllinux_1_2
          before-script-linux: |
            git config --global --add safe.directory /github/workspace
            git config --global --add safe.directory /home/runner/work/cfsem-py/cfsem-py
            yum install -y clang lld libstdc++-devel openblas-devel
      - name: Install auditwheel
        run: python -m pip install auditwheel
      - name: Repair wheels
        run: bindings/repair_wheel.sh dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        python-version: ['3.13']
        platform:
          - runner: windows-latest
            target: x64
            maturin_args: --release --out dist --find-interpreter
          - runner: windows-latest
            target: x86
            maturin_args: --release --out dist --find-interpreter --no-default-features --features=python
    steps:
      - uses: actions/checkout@v4
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.platform.target }}
      - name: Install OpenBLAS (windows)
        shell: pwsh
        run: |
          $triplet = if ("${{ matrix.platform.target }}" -eq "x86") { "x86-windows" } else { "x64-windows" }
          & "C:\vcpkg\vcpkg.exe" install "openblas:$triplet"
          "CMAKE_PREFIX_PATH=C:\vcpkg\installed\$triplet" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: ${{ matrix.platform.maturin_args }}
          sccache: 'true'
      - name: Install delvewheel
        run: python -m pip install delvewheel
      - name: Repair wheels
        run: bindings/repair_wheel.sh dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        python-version: ['3.13']
        platform:
          - runner: macos-15-intel
            target: x86_64
            # macos-15 runner is arm64
            maturin_args: --release --out dist --find-interpreter
          - runner: macos-15
            target: aarch64
            maturin_args: --release --out dist --find-interpreter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: ${{ matrix.platform.maturin_args }}
          sccache: 'true'
      - name: Install delocate
        run: python -m pip install delocate
      - name: Repair wheels
        run: bindings/repair_wheel.sh dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}-py${{ matrix.python-version }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Initialize submodules
        run: git submodule update --init --recursive --depth 1
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    #if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, musllinux, windows, macos, sdist, test]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        #if: ${{ startsWith(github.ref, 'refs/tags/') }}
        if: github.ref == 'refs/heads/release'
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.MATURIN_PASSWORD }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
